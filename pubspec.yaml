name: NativeChat
description: "NativeChat - Aplicativo de aprendizado de inglês com IA conversacional"
publish_to: 'none'

version: 1.0.0+4

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  intl: ^0.20.2

  cupertino_icons: ^1.0.8

  # Estado
  flutter_riverpod: ^2.6.1

  # HTTP
  dio: ^5.8.0

  # Banco local (Drift/SQLite)
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.25
  path_provider: ^2.1.4
  path: ^1.9.0

  # Firebase
  firebase_core: ^3.8.0
  firebase_ai: ^2.1.0

  # Configuração
  flutter_dotenv: ^5.2.1

  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.69.0

  # Preferências locais
  shared_preferences: ^2.3.2

  # Pagamentos / assinaturas
  purchases_flutter: ^8.0.0

  # Splash screen
  flutter_native_splash: ^2.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Geração de código Drift
  drift_dev: ^2.20.0
  build_runner: ^2.4.12

  # App icon e splash generator
  flutter_launcher_icons: ^0.14.3

flutter:
  generate: true
  uses-material-design: true

  assets:
    - .env
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  web:
    generate: false

flutter_native_splash:
  color: "#1A1A2E"
  image: assets/images/splash_logo.png
  color_dark: "#1A1A2E"
  image_dark: assets/images/splash_logo.png
  android_12:
    image: assets/images/splash_logo.png
    icon_background_color: "#1A1A2E"
    image_dark: assets/images/splash_logo.png
    icon_background_color_dark: "#1A1A2E"
  fullscreen: false